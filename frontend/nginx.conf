# Servidor do estático do frontend (dentro da rede do compose).
# O /api é roteado antes, pelo proxy (docker/nginx/nginx.conf).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Assets com hash no nome: cache longo.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA: qualquer rota cai no index e o Vue Router resolve. O index nunca é cacheado,
  # senão um deploy novo continuaria servindo o bundle antigo.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
