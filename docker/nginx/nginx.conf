# MINI-CRM — proxy de entrada (SPEC §2.1, §12.2). Único serviço publicado (:8080).
#   /api/*  → backend:8000 (FastAPI)
#   resto   → frontend:80 (estático da SPA)

server {
  listen 80;
  server_name _;

  client_max_body_size 2m;
  server_tokens off;

  # Relativo: o Location volta para a mesma origem, com a porta publicada (8080).
  absolute_redirect off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;
  # Sem CDN: fontes, scripts e estilos são todos locais (instalação offline).
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  location / {
    proxy_pass http://frontend:80;
    proxy_set_header Host $host;
  }
}
