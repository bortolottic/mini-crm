# MINI-CRM — CI (SPEC §15). Mesmo portão da tarefa "qualidade: tudo" do VS Code.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: minicrm
          POSTGRES_PASSWORD: minicrm
          POSTGRES_DB: minicrm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U minicrm" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: test
      TEST_DATABASE_URL: postgresql+psycopg://minicrm:minicrm@127.0.0.1:5432/minicrm_test
      JWT_SECRET: ci-jwt-secret-0123456789-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: pytest -q --cov=app --cov-report=term-missing
      - run: pip install pip-audit && pip-audit -r requirements.txt
        continue-on-error: true  # informativo até a F10 (SPEC §12.2)

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build  # lint de design + vue-tsc + vite build
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true  # informativo até a F10

  stack:
    # Fumaça: imagens de produção sobem, migrations rodam e o E2E passa pelo proxy.
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Subir stack completo
        # Sem .env: o backend sobe em APP_ENV=development (padrão), suficiente para a fumaça.
        run: docker compose up -d --build --wait
      - run: curl -fsS http://127.0.0.1:8080/api/v1/health/ready
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: E2E
        working-directory: frontend
        run: |
          npm ci --no-fund --no-audit
          npx playwright install --with-deps chromium
          npx playwright test
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
      - if: failure()
        run: docker compose logs
