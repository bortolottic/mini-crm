[project]
name = "minicrm-backend"
version = "0.1.0"
description = "MINI-CRM — API"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]
ignore = [
  "RUF001", "RUF002", "RUF003",  # textos em pt-BR usam acentos e travessões de propósito
  "B008",                        # Depends()/Query() em default é o idioma do FastAPI
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true
exclude = ["migrations/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["db: exige PostgreSQL (TEST_DATABASE_URL)"]
filterwarnings = [
  "error::DeprecationWarning:app.*",
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/seed.py"]

[tool.coverage.report]
skip_empty = true
